name: board-sync
on:
  schedule:
    - cron: '*/10 * * * *'   # 10分ごと（GitHub都合で数分ずれることあり）
  workflow_dispatch:          # 手動実行もできる
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Discord messages and push to Apps Script
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SHARED_TOKEN: ${{ secrets.BOARD_SHARED_TOKEN }}
          CHANNEL_ID: "1484129314122502315"
          APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbygruSomnxo__KoY3BxEbwOrZEcrPVggI1tqOOA6btrJRqfo8mfvUbpT2RX8DZ8_j3e/exec"
        run: |
          HTTP=$(curl -s -w "%{http_code}" -H "Authorization: Bot $BOT_TOKEN" -H "User-Agent: DiscordBot (https://gaogao, 1.0)" \
            "https://discord.com/api/v10/channels/$CHANNEL_ID/messages?limit=50" -o messages.json)
          echo "Discord HTTP status: $HTTP"
          echo "Discord response (head):"; head -c 200 messages.json; echo
          # ★2026-08-23 修正：Discordが配列を返さない（401/403/404/429/5xx）ときは
          #   Apps Scriptへ「0件」を送らない（送ると掲示板が空で上書きされる）。失敗として通知して止める。
          if ! jq -e 'type=="array"' messages.json >/dev/null 2>&1; then
            echo "⚠️ Discord APIが正常なメッセージ配列を返しませんでした（HTTP $HTTP）。Apps Scriptへは送信しません。"
            case "$HTTP" in
              429|5*) echo "→ 一時的な可能性。次回の実行で回復を待ちます。"; exit 0 ;;
              *)      echo "→ 恒久的な可能性（401=Botトークン失効, 403=権限不足, 404=チャンネルID誤り/Bot未参加）。要対応のため失敗として通知します。"; exit 1 ;;
            esac
          fi
          jq -c --arg token "$SHARED_TOKEN" 'if type=="array" then {action:"boardSync",token:$token,messages:[.[]|{id,content,timestamp,author:(.author.global_name // .author.username // ""),pinned:(.pinned // false),bot:(.author.bot // false),webhook:(has("webhook_id"))}]} else {action:"boardSync",token:$token,messages:[]} end' messages.json > payload.json
          echo "messages: $(jq '.messages|length' payload.json)"
          # ★2026-08-23 修正：-X POST を外す。Apps Scriptは302で返事を別URLへ逃がすため、
          #   -X POST のままだとリダイレクト先にもPOSTして405になり、本当の返事が見えなかった（8/22以前から）。
          #   --data だけならcurlは最初だけPOST、302後はGETで返事を取りに行く。
          # ★2026-09-20 修正：Apps Script 側の一時的な不調で10回に1回失敗していた（直近40回中4回。Discordは200・2件取得済みなのに
          #   Apps Script が Google のエラーHTMLや doGet の既定文を返す）。boardSync は同じ内容を何度送っても結果が同じ（上書き）なので、
          #   20秒あけて3回まで送り直す。3回とも ok:true が無ければ従来どおり失敗として通知（黙って緑にしない）。
          OK=0
          for TRY in 1 2 3; do
            RESP=$(curl -sL "$APPS_SCRIPT_URL" -H "Content-Type: text/plain;charset=utf-8" --data @payload.json -w "\nHTTP %{http_code}")
            if echo "$RESP" | grep -q '"ok":true'; then echo "Apps Script (${TRY}回目): $RESP"; OK=1; break; fi
            echo "Apps Script (${TRY}回目) ok:true なし: $(echo "$RESP" | head -c 160 | tr '\n' ' ') … $(echo "$RESP" | tail -1)"
            [ "$TRY" -lt 3 ] && sleep 20
          done
          [ "$OK" = "1" ] || { echo "⚠️ Apps Scriptが3回とも ok:true を返しませんでした"; exit 1; }
