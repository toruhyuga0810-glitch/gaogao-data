<title>OS6 Farm control — 現地設定</title>
<link rel="icon" href="data:,">
<!-- ─────────────────────────────────────────────────────────────
  OS6：Farm control 段B「現地設定画面」v0.2（2026-08-30）
  ・読み  = Googleスプレッドシート gviz（圃場／ハウス区画／畝・作付け／圃場別価格表）
  ・書き  = Apps Script WebApp POST（action: os6UpsertField / os6UpsertHouse / os6UpsertBeds）管理者トークン必須
  ・地図  = Leaflet + 国土地理院 航空写真タイル（出典表記で利用可・キー不要）
  ・場所  = 地図アプリの型：住所・地名検索（国土地理院 住所検索API・鍵不要）／現在地（GPS）／ピンをドラッグ／
            住所の自動取得（地理院 逆ジオコーダ＋市区町村表）。施設名の検索と番地つき住所は Apps Script の Google ジオコーダ（os6Geocode）で補う
  ・通信が無いときは localStorage に溜めて「未送信N件」を表示（黙った失敗の禁止）。設定・gviz・POST・キューは os6-common.js（record.html と共有）
  ・PC=2ペイン／タブレット=2ペイン／スマホ=縦積み
───────────────────────────────────────────────────────────── -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<style>
  :root{--g:#587565;--g2:#3d5248;--g3:#dae5dd;--bg:#f4f4f1;--ink:#2b2f2d;--mut:#6b7a72;--line:#c9d4cc;--warn:#b7791f;--bad:#a94442;--blue:#1a73e8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
  header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  header h1{font-size:15px;margin:0;color:var(--g2);white-space:nowrap}
  header select,header button{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;max-width:100%}
  header select{min-width:0;flex:0 1 auto;text-overflow:ellipsis}
  .badge{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap} .badge.q{color:var(--warn);font-weight:600}
  @media (max-width:900px){header{flex-wrap:wrap;row-gap:6px} header select{flex:1 1 60%} .badge{margin-left:0;flex-basis:100%}}
  .wrap{display:grid;grid-template-columns:1fr 420px;height:calc(100% - 46px)}
  .mapwrap{position:relative;height:100%;min-height:360px} #map{height:100%}
  .panel{overflow:auto;background:#fff;border-left:1px solid var(--line);padding:12px 14px}
  @media (max-width:900px){.wrap{grid-template-columns:1fr;grid-template-rows:56vh 1fr;height:auto}.panel{border-left:0;border-top:1px solid var(--line)}}
  /* 地図の上に載せる検索バー（地図アプリの型）・現在地ボタン */
  .searchbar{position:absolute;z-index:1000;top:10px;left:56px;right:10px;max-width:440px}
  .searchbar .in{display:flex;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.25);overflow:hidden}
  .searchbar input{flex:1;font:inherit;font-size:15px;padding:10px 12px;border:0;outline:0;min-width:0}
  .searchbar button{font:inherit;border:0;background:var(--g);color:#fff;padding:0 14px;cursor:pointer}
  .qlist{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.25);margin-top:6px;max-height:40vh;overflow:auto;display:none}
  .qlist div{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px} .qlist div:last-child{border-bottom:0} .qlist div:hover{background:var(--g3)}
  .qlist small{display:block;color:var(--mut);font-size:11px} .qlist .note{color:var(--mut);cursor:default;font-size:12px} .qlist .note:hover{background:#fff}
  .qlist .act{color:var(--blue);font-weight:600}
  .locate{position:absolute;z-index:1000;right:10px;bottom:28px;width:46px;height:46px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--g2)}
  .locate.on{color:var(--blue)} .locate svg{width:24px;height:24px}
  .locinfo{position:absolute;z-index:1000;right:62px;bottom:38px;font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:999px;display:none}
  h2{font-size:14px;color:var(--g2);margin:14px 0 6px;border-left:4px solid var(--g);padding-left:8px}
  .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
  .kpi div{background:var(--g3);border-radius:6px;padding:8px;text-align:center}.kpi b{display:block;font-size:18px;color:var(--g2)}.kpi span{font-size:11px;color:var(--mut)}
  table{border-collapse:collapse;width:100%;font-size:13px} th,td{border:1px solid var(--line);padding:4px 5px;text-align:left;vertical-align:middle} th{background:var(--g3);color:var(--g2);font-weight:600;white-space:nowrap}
  td input,td select{width:100%;font:inherit;font-size:13px;padding:4px;border:1px solid var(--line);border-radius:4px;background:#fff}
  td input.n{width:64px} td input.d{width:120px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0} .row label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px;min-width:120px;flex:1}
  .row input,.row select{font:inherit;padding:7px;border:1px solid var(--line);border-radius:6px}
  .btn{font:inherit;padding:9px 14px;border:0;border-radius:8px;background:var(--g);color:#fff;cursor:pointer} .btn.sub{background:#fff;color:var(--g2);border:1px solid var(--line)} .btn:disabled{opacity:.5}
  .chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;background:var(--g3);color:var(--g2)} .chip.warn{background:#f7ecd2;color:var(--warn)} .chip.bad{background:#f2dfda;color:var(--bad)} .chip.mut{background:#e6e6e2;color:#666}
  .hint{font-size:12px;color:var(--mut);margin:4px 0}
  .msg{margin:8px 0;padding:8px 10px;border-radius:6px;font-size:13px} .msg.ok{background:#e3efe6;color:#2e5b3f} .msg.err{background:#f2dfda;color:var(--bad)}
  .loc{font-size:13px;margin:6px 0;line-height:1.7} .loc a{color:var(--blue)}
  .house-label{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:12px;color:var(--g2);white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .house-label small{display:block;color:var(--mut);font-size:10px}
  .leaflet-container{font-family:inherit} .leaflet-popup-content{margin:10px 12px;font-size:13px} .leaflet-popup-content .btn{padding:6px 10px;font-size:13px;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>OS6 現地設定</h1>
  <a href="index.html" style="font-size:13px;color:var(--g2);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:5px 9px;background:#fff;white-space:nowrap">俯瞰</a>
  <select id="field"></select>
  <button id="btnNewField" title="新しい圃場を登録（場所は検索・現在地・ピンで決める）">＋ 新しい圃場</button>
  <span id="badge" class="badge">読み込み中…</span>
</header>
<div class="wrap">
  <div class="mapwrap">
    <div id="map"></div>
    <div class="searchbar">
      <div class="in"><input id="q" placeholder="住所・地名を入力すると候補が出ます（マップのリンク・座標も可）" autocomplete="off" enterkeyhint="search"><button id="qGo">検索</button></div>
      <div id="qList" class="qlist"></div>
    </div>
    <span id="locInfo" class="locinfo"></span>
    <button id="btnLocate" class="locate" title="現在地（もう一度押すと追従をやめる）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  </div>
  <aside class="panel">
    <div id="msg"></div>
    <div id="fieldInfo"></div>
    <div id="posForm" style="display:none"></div>
    <div id="placeForm" style="display:none"></div>
    <div id="houseForm" style="display:none"></div>
    <div id="houseDetail"><p class="hint">上の検索バーで住所・地名を探すか、右下の◎で現在地へ。地図左の「多角形」「四角形」でハウス／露地を囲むと面積が自動で出て、名前・畝の本数を入れて保存できます。保存済みのハウスは地図上で選べます。</p></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="os6-common.js?v=2"></script>
<script>
// ───────── 場所を探す・現在地・住所の自動取得（地図アプリの型）─────────
const geo = {
  // 住所・地名・座標 → 候補（国土地理院・鍵不要・都道府県〜大字レベル）
  async search(q){
    const m=q.match(/^\s*(-?\d{1,2}\.\d+)\s*[,、\s]\s*(-?\d{1,3}\.\d+)\s*$/); if(m) return [{name:`座標 ${m[1]}, ${m[2]}`, lat:+m[1], lng:+m[2], src:"座標"}];
    // Googleマップ・Appleマップの共有リンクを貼ったら、その地点へ（@lat,lng ／ q=・ll=・destination=lat,lng）
    const u=q.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/) || q.match(/[?&](?:q|ll|center|destination|sll)=(-?\d{1,2}\.\d+)(?:%2C|,)(-?\d{1,3}\.\d+)/);
    if(u) return [{name:`リンクの地点 ${(+u[1]).toFixed(5)}, ${(+u[2]).toFixed(5)}`, lat:+u[1], lng:+u[2], src:"マップのリンク"}];
    const r=await fetch(CONFIG.GSI_SEARCH+encodeURIComponent(q)); if(!r.ok) throw new Error(`住所検索に失敗（HTTP ${r.status}）`);
    const j=await r.json(); return (Array.isArray(j)?j:[]).slice(0,10).map(f=>({name:f.properties.title, lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0], src:"地理院"}));
  },
  // 施設名・店名・番地つき → Apps Script経由のGoogleジオコーダ（要パスワード・GAS側に os6Geocode がある時だけ）
  async searchGoogle(q){ const r=await post({action:"os6Geocode", q},{queueOnFail:false}); return (r.items||[]).map(i=>({name:i.name, lat:+i.lat, lng:+i.lng, src:"Google"})); },
  muni:null,
  async loadMuni(){ if(this.muni) return this.muni;
    window.GSI = window.GSI || {}; // muni.js は GSI.MUNI_ARRAY に代入するだけで GSI 自体は作らない
    await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=CONFIG.GSI_MUNI; s.onload=res; s.onerror=()=>rej(new Error("市区町村表を読めません")); document.head.appendChild(s); });
    this.muni=(window.GSI&&GSI.MUNI_ARRAY)||{}; return this.muni; },
  // 緯度経度 → 「茨城県かすみがうら市牛渡」（地理院 逆ジオコーダ＋市区町村表）
  async reverse(lat,lng){
    const [r,muni]=await Promise.all([fetch(CONFIG.GSI_REVERSE.replace("{lat}",lat).replace("{lng}",lng)).then(x=>x.json()), this.loadMuni()]);
    const res=r&&r.results; if(!res||!res.muniCd) return ""; const m=String(muni[String(parseInt(res.muniCd,10))]||"").split(","); return (m[1]||"")+(m[3]||"")+(res.lv01Nm||"");
  },
  async reverseGoogle(lat,lng){ const r=await post({action:"os6ReverseGeocode",lat,lng},{queueOnFail:false}); return r.address||""; },
  // まず地理院、パスワード保存済みなら Google の番地つき住所で上書き（失敗しても地理院の結果は残す）
  async address(lat,lng){ let a=""; try{ a=await this.reverse(lat,lng); }catch(e){}
    if(hasToken()){ try{ const g=await this.reverseGoogle(lat,lng); if(g) a=g; }catch(e){} } return a; }
};
let CAND=null; // 検索候補のピン（1本だけ）
function showCandidates(list, note, action){
  const box=$("qList"); box.innerHTML = list.map((c,i)=>`<div data-i="${i}">${esc(c.name)}<small>${esc(c.src)} ・ ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}</small></div>`).join("") + (note? `<div class="note">${esc(note)}</div>`:"");
  box.querySelectorAll("div[data-i]").forEach(el=>{ el.onclick=()=>{ goTo(list[+el.dataset.i]); box.style.display="none"; }; });
  if(action){ const b=document.createElement("div"); b.className="act"; b.textContent=action.label; b.onclick=action.fn; box.appendChild(b); }
  box.style.display = box.innerHTML? "block":"none";
}
function useAsFieldPos(){ if(!CAND) return; const p=CAND.getLatLng(); MAP.removeLayer(CAND); CAND=null; openPosForm(FIELD, [p.lat,p.lng]); }
// 候補ピンを立てる（検索の選択・地図の長押し/右クリック）。住所は後から自動で埋める
function dropCand(c){
  if(CAND) MAP.removeLayer(CAND);
  CAND=L.marker([c.lat,c.lng]).addTo(MAP).bindPopup(`<b>${esc(c.name)}</b><br><span class="hint" id="candAddr">住所を調べています…</span><br>
    <button class="btn" id="candUse">ここを圃場の位置にする</button> <button class="btn sub" id="candSave">場所帳に保存</button><br>
    <a class="hint" href="${navUrl(c.lat,c.lng)}" target="_blank" rel="noopener">ナビで開く</a>`);
  const bind=()=>{ const b=$("candUse"); if(b) b.onclick=useAsFieldPos; const s=$("candSave"); if(s) s.onclick=()=>openPlaceForm(c); };
  CAND.on("popupopen",bind); CAND.openPopup(); bind();
  geo.address((+c.lat).toFixed(6), (+c.lng).toFixed(6)).then(a=>{ const el=$("candAddr"); if(el) el.textContent = a || "（住所が取れない地点）"; }).catch(()=>{});
}
// 自社の場所（圃場・ハウス・場所帳）を検索の最上位に出す。使うほど「自分の地図」になる
function matchOwn(q){
  const n=q.toLowerCase(); if(n.length<1 || /^https?:/.test(n)) return [];
  const list=[];
  DATA.fields.forEach(f=>{ const la=parseFloat(col(f,"緯度")), ln=parseFloat(col(f,"経度"));
    if(!isNaN(la)&&!isNaN(ln)&&(String(col(f,"正規名"))+String(col(f,"所在地"))).toLowerCase().includes(n)) list.push({name:col(f,"正規名"), lat:la, lng:ln, src:"自社・圃場"}); });
  DATA.houses.forEach(h=>{ try{ const sh=JSON.parse(col(h,"図形")||"null");
    if(sh&&sh.length>=3&&String(col(h,"名称")).toLowerCase().includes(n)){ const la=sh.reduce((s,p)=>s+p[0],0)/sh.length, ln=sh.reduce((s,p)=>s+p[1],0)/sh.length; list.push({name:col(h,"名称")+"（ハウス）", lat:la, lng:ln, src:"自社"}); } }catch(e){} });
  (DATA.places||[]).forEach(pl=>{ const la=parseFloat(col(pl,"緯度")), ln=parseFloat(col(pl,"経度"));
    if(!isNaN(la)&&!isNaN(ln)&&(String(col(pl,"名称"))+String(col(pl,"種別"))+String(col(pl,"メモ"))).toLowerCase().includes(n)) list.push({name:col(pl,"名称")+(col(pl,"種別")? "・"+col(pl,"種別"):""), lat:la, lng:ln, src:"自社・場所帳"}); });
  return list.slice(0,6);
}
function nextPlaceId(){ return "P"+((DATA.places||[]).reduce((m,p)=>Math.max(m,parseInt(String(col(p,"場所ID")).replace(/\D/g,""))||0),0)+1); }
function openPlaceForm(c){
  closePosForm(); $("houseForm").style.display="none";
  const got=$("candAddr")? $("candAddr").textContent : ""; const addr=/調べています|取れない/.test(got)? "" : got;
  const f=$("placeForm"); f.style.display="block";
  f.innerHTML=`<h2>場所帳に保存</h2><div class="hint">保存すると、次からは検索で名前を打つだけでここに飛べます（自社の場所が候補の最上位に出ます）。</div>
   <div class="row"><label>名称<input id="pl_name" placeholder="例：JA土浦 ◯◯支所／富沢商店"></label><label>種別<select id="pl_type">${["JA","直売所","市場","取引先","倉庫","施設","その他"].map(t=>`<option>${t}</option>`).join("")}</select></label></div>
   <div class="row"><label>住所<input id="pl_addr" value="${esc(addr)}"></label></div>
   <div class="row"><label>メモ<input id="pl_note" placeholder="例：入口は北側・担当◯◯さん"></label></div>
   <div class="row"><button class="btn" id="pl_save">保存</button><button class="btn sub" id="pl_cancel">やめる</button></div>`;
  $("pl_cancel").onclick=()=>{ f.style.display="none"; };
  $("pl_save").onclick=async()=>{
    const name=$("pl_name").value.trim(); if(!name){ say("名称を入れてください","err"); return; }
    $("pl_save").disabled=true;
    const row={ "場所ID":nextPlaceId(), "名称":name, "種別":$("pl_type").value, "緯度":+(+c.lat).toFixed(6), "経度":+(+c.lng).toFixed(6), "住所":$("pl_addr").value.trim(), "メモ":$("pl_note").value.trim() };
    try{ const r=await post({action:"os6UpsertPlace",row}); if(r.ok){ say(`場所帳に保存しました：${name}`); f.style.display="none"; if(CAND){ MAP.removeLayer(CAND); CAND=null; } await loadAll(); } }
    catch(e){ say("保存エラー："+e.message,"err"); } $("pl_save").disabled=false;
  };
  document.querySelector(".panel").scrollTop=0;
}
function goTo(c){
  MAP.flyTo([c.lat,c.lng], Math.max(MAP.getZoom(),16));
  if(POS){ setPin(c.lat,c.lng); return; }
  dropCand(c);
}
async function runSearch(withGoogle, live){
  const q=$("q").value.trim(); if(!q){ $("qList").style.display="none"; return; } $("qGo").disabled=true;
  const seq=++SEARCH_SEQ;
  try{
    let list=matchOwn(q), note="";
    try{ list=list.concat(await geo.search(q)); }catch(e){ note=e.message; }
    if(seq!==SEARCH_SEQ) return; // 入力が先へ進んでいたら古い結果は捨てる
    if(withGoogle || (!live && hasToken() && !list.length)){ try{ list=list.concat(await geo.searchGoogle(q)); }catch(e){ note="Google検索："+e.message; } }
    // 短縮リンク（maps.app.goo.gl 等）は Apps Script が辿って座標にする（検索ボタン／Enterのときだけ）
    if(!live && !list.length && /^https?:\/\//i.test(q)){
      if(hasToken()){ try{ const r=await post({action:"os6ResolveLink",url:q},{queueOnFail:false}); if(r.ok) list=[{name:`リンクの地点 ${(+r.lat).toFixed(5)}, ${(+r.lng).toFixed(5)}`, lat:+r.lat, lng:+r.lng, src:"マップのリンク"}]; }catch(e){ note="リンク展開："+e.message; } }
      else note="短縮リンクの展開には管理者パスワードが要ります（下の「パスワードを入れて展開」を押してください）";
    }
    if(seq!==SEARCH_SEQ) return;
    let action=null;
    if(!list.length && /^https?:\/\//i.test(q) && !hasToken()) action={label:"パスワードを入れて展開", fn:()=>{ token(); runSearch(false); }};
    if(!list.length && live){ $("qList").style.display="none"; $("qGo").disabled=false; return; } // 入力途中は静かに
    if(!list.length && !note) note = hasToken()? "見つかりません。市町村名から入れると当たりやすいです。地図の長押し（右クリック）でも指定できます" : "見つかりません。施設名・店名で探すには「Googleで探す」（管理者パスワードが要ります）。地図の長押し（右クリック）でも指定できます";
    if(!list.length && !hasToken() && !withGoogle && !action) action={label:"Googleで探す", fn:()=>runSearch(true)};
    showCandidates(list, note, action);
  }catch(e){ if(seq===SEARCH_SEQ) showCandidates([], e.message); }
  $("qGo").disabled=false;
}
let SEARCH_SEQ=0, QT=null;
$("qGo").onclick=()=>runSearch(false); $("q").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); clearTimeout(QT); runSearch(false); } });
// 地図アプリの型：入力しながら候補を出す（IME変換中は待つ・2文字から・0.3秒の間を置く）
$("q").addEventListener("input",e=>{ if(e.isComposing) return; clearTimeout(QT); const q=$("q").value.trim(); if(q.length<2){ $("qList").style.display="none"; return; } QT=setTimeout(()=>runSearch(false,true),300); });
$("q").addEventListener("compositionend",()=>{ clearTimeout(QT); if($("q").value.trim().length>=2) QT=setTimeout(()=>runSearch(false,true),200); });
document.addEventListener("click",e=>{ if(!e.target.closest(".searchbar")) $("qList").style.display="none"; });

// 現在地（押すと追従開始・もう一度で停止）
let WATCH=null, ME=null, MECIRC=null;
function stopLocate(){ if(WATCH!==null) navigator.geolocation.clearWatch(WATCH); WATCH=null; $("btnLocate").classList.remove("on"); $("locInfo").style.display="none"; }
$("btnLocate").onclick=()=>{
  if(!navigator.geolocation){ say("この端末（ブラウザ）では位置情報が使えません","err"); return; }
  if(WATCH!==null){ stopLocate(); return; }
  $("btnLocate").classList.add("on"); $("locInfo").style.display="inline"; $("locInfo").textContent="現在地を取得中…"; let first=true;
  WATCH=navigator.geolocation.watchPosition(p=>{
    const lat=p.coords.latitude, lng=p.coords.longitude, acc=Math.round(p.coords.accuracy||0);
    if(!ME){ ME=L.circleMarker([lat,lng],{radius:7,color:"#fff",weight:2,fillColor:"#1a73e8",fillOpacity:1}).addTo(MAP); MECIRC=L.circle([lat,lng],{radius:acc,color:"#1a73e8",weight:1,fillOpacity:.12}).addTo(MAP); }
    else { ME.setLatLng([lat,lng]); MECIRC.setLatLng([lat,lng]).setRadius(acc); }
    $("locInfo").textContent=`現在地 ±${acc}m`;
    if(first){ first=false; MAP.flyTo([lat,lng], Math.max(MAP.getZoom(),17)); if(POS) setPin(lat,lng); }
  }, e=>{
    say(e.code===1? "位置情報が許可されていません。ブラウザ（またはiPadの設定→プライバシー→位置情報）でこのサイトを許可してください" : `現在地を取得できません（${e.message}）`,"err");
    stopLocate();
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
};

// ───────── 状態 ─────────
let DATA={fields:[],houses:[],beds:[],items:[]}, MAP, LAYER, DRAWN, SEL=null, FIELD=null, PIN=null, POS=null; // POS = 位置設定モード {isNew,id,seq}
function chip(st){ const cls = st==="順調"?"":(st==="注意"||st==="遅延")?"warn":(st==="害虫")?"bad":"mut"; return `<span class="chip ${cls}">${esc(st||"未入力")}</span>`; }
const navUrl = (lat,lng) => `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

async function loadAll(){
  say("");
  try{
    const [F,H,B,P,PL]=await Promise.all([readTab(CONFIG.TAB_FIELD),readTab(CONFIG.TAB_HOUSE),readTab(CONFIG.TAB_BED),readTab(CONFIG.TAB_PRICE),readTab("場所").catch(()=>({rows:[]}))]);
    DATA.fields=F.rows; DATA.houses=H.rows; DATA.beds=B.rows; DATA.places=PL.rows;
    DATA.items=P.rows.map(r=>r["呼称"]).filter(Boolean);
    const sel=$("field"); const keep=sel.value; sel.innerHTML=DATA.fields.map(f=>`<option value="${esc(fid(f))}">${esc(col(f,"正規名"))}</option>`).join("");
    if(keep) sel.value=keep; FIELD = DATA.fields.find(f=>fid(f)===sel.value) || DATA.fields[0];
    renderField(); renderBadge();
  }catch(e){ say("読み込みエラー：" + e.message + "（スプレッドシートの共有が「リンクを知っている全員」になっているか確認）","err"); }
}

// ───────── 地図 ─────────
function initMap(){
  MAP=L.map("map",{zoomControl:true}).setView(CONFIG.DEFAULT_CENTER, CONFIG.DEFAULT_ZOOM);
  L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg",{maxZoom:18,attribution:'出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'}).addTo(MAP);
  LAYER=L.featureGroup().addTo(MAP); DRAWN=L.featureGroup().addTo(MAP);
  L.drawLocal.draw.toolbar.buttons.polygon="多角形で囲む（ハウス／露地）"; L.drawLocal.draw.toolbar.buttons.rectangle="四角形で囲む";
  MAP.addControl(new L.Control.Draw({position:"topleft", draw:{polyline:false,circle:false,marker:false,circlemarker:false,polygon:{allowIntersection:false,showArea:true,metric:true},rectangle:{showArea:true,metric:true}}, edit:{featureGroup:DRAWN,edit:false,remove:false}}));
  MAP.on(L.Draw.Event.CREATED, e=>{ DRAWN.clearLayers(); DRAWN.addLayer(e.layer); openHouseForm(e.layer); });
  // 地図アプリの型：位置設定中はタップした場所にピンが動く／それ以外は長押し（PCは右クリック）で候補ピン
  MAP.on("click", e=>{ if(POS) setPin(e.latlng.lat, e.latlng.lng); });
  MAP.on("contextmenu", e=>{ if(POS) setPin(e.latlng.lat, e.latlng.lng); else dropCand({name:"指定した地点", lat:e.latlng.lat, lng:e.latlng.lng, src:"地図"}); });
}
function areaOf(latlngs){ return Math.round(L.GeometryUtil.geodesicArea(latlngs)); }
function renderField(){
  LAYER.clearLayers(); DRAWN.clearLayers(); SEL=null; $("houseForm").style.display="none"; closePosForm();
  if(!FIELD){ $("fieldInfo").innerHTML=`<p class="hint">圃場がまだありません。「＋ 新しい圃場」から登録してください。</p>`; renderHouseDetail(); return; }
  const lat=parseFloat(col(FIELD,"緯度")), lng=parseFloat(col(FIELD,"経度")); const has=!isNaN(lat)&&!isNaN(lng);
  const houses=DATA.houses.filter(h=>col(h,"圃場ID")===fid(FIELD));
  $("fieldInfo").innerHTML=`<h2>${esc(col(FIELD,"正規名"))} <span class="chip">${esc(col(FIELD,"稼働")||"—")}</span></h2>
   <div class="kpi"><div><b>${houses.length}</b><span>ハウス・区画</span></div><div><b>${DATA.beds.filter(b=>houses.some(h=>hid(h)===col(b,"区画ID"))).length}</b><span>畝</span></div><div><b>${houses.reduce((s,h)=>s+(parseFloat(col(h,"面積"))||0),0).toLocaleString()}</b><span>㎡</span></div></div>
   <div class="loc">所在地：${esc(col(FIELD,"所在地")||"（未設定）")}<br>位置：${has? `${lat.toFixed(5)}, ${lng.toFixed(5)} ・ <a href="${navUrl(lat,lng)}" target="_blank" rel="noopener">ナビで開く</a>` : "（未設定）"}</div>
   <div class="row"><button class="btn sub" id="btnPos">${has? "位置・所在地を直す" : "位置を設定する"}</button></div>`
   + (has? "" : `<p class="hint">初回だけ：上の検索バーで住所を探す／右下の◎で現在地へ／ピンをドラッグ、のどれかで場所を合わせて保存します。</p>`);
  $("btnPos").onclick=()=>openPosForm(FIELD, has? [lat,lng] : null);
  let bounds=[];
  houses.forEach(h=>{ let shape=null; try{ shape=JSON.parse(col(h,"図形")||"null"); }catch(e){}
    if(shape && shape.length>=3){ const poly=L.polygon(shape,{color:"#587565",weight:2,fillOpacity:.25}).addTo(LAYER);
      poly.bindTooltip(`<div class="house-label">${esc(col(h,"名称")||hid(h))}<small>${esc(col(h,"面積")||"?")}㎡ ・ ${esc(col(h,"状態")||"未入力")}</small></div>`,{permanent:true,direction:"center",className:"nolabel"});
      poly.on("click",()=>selectHouse(h)); bounds=bounds.concat(shape); }
  });
  if(bounds.length) MAP.fitBounds(bounds,{padding:[30,30],maxZoom:18}); else if(has) MAP.setView([lat,lng],17);
  renderHouseDetail();
}

// ───────── 圃場の位置・所在地（ピン）／新しい圃場 ─────────
function nextFieldId(){ const n=DATA.fields.reduce((m,f)=>Math.max(m, parseInt(String(fid(f)).replace(/\D/g,""))||0),0)+1; return {id:`F${n}`, n}; }
function setPin(lat,lng){
  if(!PIN){ PIN=L.marker([lat,lng],{draggable:true,title:"ドラッグで位置を合わせる"}).addTo(MAP); PIN.on("dragend",onPinMoved); } else PIN.setLatLng([lat,lng]);
  onPinMoved();
}
async function onPinMoved(){
  if(!PIN||!POS) return; const p=PIN.getLatLng(); const seq=++POS.seq;
  $("p_ll").textContent=`${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}`; $("p_addrHint").textContent="住所を調べています…";
  const a=await geo.address(p.lat.toFixed(6), p.lng.toFixed(6)); if(!POS||seq!==POS.seq) return; // 連続ドラッグは最後だけ反映
  if(a){ $("p_addr").value=a; $("p_addrHint").textContent="自動取得（直せます）"; } else $("p_addrHint").textContent="住所を取得できませんでした（手入力できます）";
}
function closePosForm(){ POS=null; if(PIN){ MAP.removeLayer(PIN); PIN=null; } $("posForm").style.display="none"; $("placeForm").style.display="none"; }
function openPosForm(field, latlng){
  const isNew=!field; const {id,n}=isNew? nextFieldId() : {id:fid(field), n:null};
  POS={isNew, id, seq:0}; $("houseForm").style.display="none"; SEL=null; renderHouseDetail();
  const f=$("posForm"); f.style.display="block";
  f.innerHTML=`<h2>${isNew? "新しい圃場を登録" : "圃場の位置・所在地"}</h2><div class="hint">圃場ID <b>${esc(id)}</b>。地図を<b>タップした場所にピンが動きます</b>（ドラッグ・検索・現在地でも可）。</div>
   <div class="row"><label>正規名（第N圃場・エリア・農家名）<input id="p_name" value="${esc(isNew? `第${n}圃場・・` : col(field,"正規名"))}"></label></div>
   <div class="row"><label>所在地<input id="p_addr" value="${esc(isNew? "" : col(field,"所在地"))}"><span class="hint" id="p_addrHint"></span></label></div>
   <div class="row"><label>稼働<select id="p_ops"><option value="">—</option>${CONFIG.OPS.map(o=>`<option ${(!isNew&&col(field,"稼働")===o)?"selected":""}>${o}</option>`).join("")}</select></label><label>緯度, 経度<span id="p_ll" style="padding:7px 0">（ピン未設定）</span></label></div>
   ${isNew? `<div class="row"><label>備考<input id="p_note" placeholder="例：区画①〜⑥・6棟"></label></div>` : ""}
   <div class="row"><button class="btn sub" id="p_here">ピンを現在地へ</button><button class="btn sub" id="p_center">ピンを地図の中心へ</button></div>
   <div class="row"><button class="btn" id="p_save">この位置で保存</button><button class="btn sub" id="p_cancel">やめる</button></div>`;
  $("p_cancel").onclick=closePosForm;
  $("p_center").onclick=()=>{ const c=MAP.getCenter(); setPin(c.lat,c.lng); };
  $("p_here").onclick=()=>{ if(ME){ const p=ME.getLatLng(); setPin(p.lat,p.lng); MAP.flyTo(p, Math.max(MAP.getZoom(),17)); } else $("btnLocate").click(); };
  if(latlng){ setPin(latlng[0],latlng[1]); MAP.setView(latlng, Math.max(MAP.getZoom(),16)); }
  $("p_save").onclick=async()=>{
    if(!PIN){ say("まずピンを置いてください（検索・現在地・「ピンを地図の中心へ」）","err"); return; }
    const name=$("p_name").value.trim(); if(!name||/・・$/.test(name)){ say("正規名を「第N圃場・エリア・農家名」の形で入れてください","err"); return; }
    const p=PIN.getLatLng(); const row={ "圃場ID":id, "正規名":name, "所在地":$("p_addr").value.trim(), "緯度":+p.lat.toFixed(6), "経度":+p.lng.toFixed(6), "稼働":$("p_ops").value };
    if(isNew) row["備考"]=$("p_note").value.trim();
    $("p_save").disabled=true;
    try{ const r=await post({action:"os6UpsertField",row}); if(r.ok){ say(`${isNew? "圃場を登録しました" : "位置を保存しました"}：${name}`); closePosForm(); await loadAll(); $("field").value=id; FIELD=DATA.fields.find(x=>fid(x)===id)||FIELD; renderField(); } }
    catch(e){ say("保存エラー："+e.message,"err"); } $("p_save").disabled=false;
  };
  document.querySelector(".panel").scrollTop=0;
}
$("btnNewField").onclick=()=>openPosForm(null, null);

// ───────── ハウスの登録 ─────────
function openHouseForm(layer){
  if(!FIELD){ say("先に「＋ 新しい圃場」で圃場を登録してください","err"); DRAWN.clearLayers(); return; }
  closePosForm();
  const ll=layer.getLatLngs()[0]; const area=areaOf(ll); const shape=ll.map(p=>[+p.lat.toFixed(6),+p.lng.toFixed(6)]);
  const n=DATA.houses.filter(h=>col(h,"圃場ID")===fid(FIELD)).length+1; const id=`${fid(FIELD)}-${n}`;
  const f=$("houseForm"); f.style.display="block";
  f.innerHTML=`<h2>新しいハウス／区画を保存</h2><div class="hint">面積 <b>${area.toLocaleString()}㎡</b>（図形から自動）・区画ID <b>${esc(id)}</b></div>
   <div class="row"><label>名称<input id="h_name" value="${esc(col(FIELD,"正規名").split("・").pop()||"")} ${n}"></label><label>種別<select id="h_type"><option>ハウス</option><option>露地</option></select></label><label>畝の本数<input id="h_beds" type="number" min="0" value="12"></label></div>
   <div class="row"><label>遮光%<input id="h_shade" type="number" min="0" max="100" placeholder="0"></label><label>加温<select id="h_heat"><option>無</option><option>有</option></select></label><label>主品目<select id="h_item"><option value="">—</option>${DATA.items.map(i=>`<option>${esc(i)}</option>`).join("")}</select></label><label>状態<select id="h_status">${CONFIG.STATUS.map(s=>`<option>${s}</option>`).join("")}</select></label></div>
   <div class="row"><button class="btn" id="h_save">このハウスを保存</button><button class="btn sub" id="h_cancel">やめる</button></div>`;
  $("h_cancel").onclick=()=>{ DRAWN.clearLayers(); f.style.display="none"; };
  $("h_save").onclick=async()=>{ $("h_save").disabled=true;
    const row={ "区画ID":id,"圃場ID":fid(FIELD),"名称":$("h_name").value.trim(),"種別":$("h_type").value,"図形":JSON.stringify(shape),"面積":area,"畝の本数":$("h_beds").value,"遮光":$("h_shade").value,"加温":$("h_heat").value,"主品目":$("h_item").value,"状態":$("h_status").value };
    try{ const r=await post({action:"os6UpsertHouse",row}); if(r.ok){ say(`保存しました：${row["名称"]}（${area}㎡）`); f.style.display="none"; await loadAll(); const h=DATA.houses.find(x=>hid(x)===id); if(h) selectHouse(h);} }
    catch(e){ say("保存エラー："+e.message,"err"); } $("h_save").disabled=false; };
  document.querySelector(".panel").scrollTop=0;
}

// ───────── 畝の編集 ─────────
function selectHouse(h){ SEL=h; closePosForm(); renderHouseDetail(); document.querySelector(".panel").scrollTop=0; }
function renderHouseDetail(){
  const d=$("houseDetail"); if(!SEL){ d.innerHTML = (FIELD && DATA.houses.filter(h=>col(h,"圃場ID")===fid(FIELD)).length)? `<p class="hint">地図上のハウスをタップすると、畝ごとの品目・株数・定植日を入力できます。</p>` : `<p class="hint">地図左の「多角形」「四角形」でハウス／露地を囲むと、面積が自動で出て保存できます。</p>`; return; }
  const n=parseInt(col(SEL,"畝の本数"))||0; const existing=DATA.beds.filter(b=>col(b,"区画ID")===hid(SEL));
  const rows=[]; for(let i=1;i<=Math.max(n,existing.length);i++){ const id=`${hid(SEL)}-${String(i).padStart(2,"0")}`; rows.push(existing.find(b=>bid(b)===id)||{"畝ID":id}); }
  d.innerHTML=`<h2>${esc(col(SEL,"名称")||hid(SEL))} ${chip(col(SEL,"状態"))}</h2>
   <div class="kpi"><div><b>${esc(col(SEL,"面積")||"?")}</b><span>㎡</span></div><div><b>${n}</b><span>畝</span></div><div><b>${existing.reduce((s,b)=>s+(parseInt(col(b,"株数"))||0),0).toLocaleString()}</b><span>株（登録済）</span></div></div>
   <div class="hint">畝の本数はハウス区画タブで変えられます。空の行は保存されません。</div>
   <div style="overflow:auto"><table><thead><tr><th>畝</th><th>品目</th><th>品種</th><th>株数</th><th>定植日</th><th>作型</th><th>状態</th></tr></thead><tbody>
   ${rows.map(b=>`<tr data-id="${esc(bid(b))}"><td>${esc(bid(b).split("-").pop())}</td>
     <td><select class="b_item"><option value="">—</option>${DATA.items.map(i=>`<option ${col(b,"品目")===i?"selected":""}>${esc(i)}</option>`).join("")}</select></td>
     <td><input class="b_var" value="${esc(col(b,"品種"))}"></td><td><input class="b_cnt n" type="number" min="0" value="${esc(col(b,"株数"))}"></td>
     <td><input class="b_date d" placeholder="2026/09/10" value="${esc(col(b,"定植日"))}"></td>
     <td><select class="b_form">${CONFIG.FORMS.map(f=>`<option ${col(b,"作型")===f?"selected":""}>${f}</option>`).join("")}</select></td>
     <td><select class="b_st">${CONFIG.STATUS.map(s=>`<option ${(col(b,"状態")||"未入力")===s?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")}
   </tbody></table></div>
   <div class="row"><button class="btn" id="b_save">畝を保存（${rows.length}本）</button><button class="btn sub" id="b_fill">1行目を全行にコピー</button></div>`;
  $("b_fill").onclick=()=>{ const trs=[...d.querySelectorAll("tbody tr")]; if(!trs.length) return; const src=trs[0]; trs.slice(1).forEach(tr=>{ ["b_item","b_var","b_cnt","b_date","b_form","b_st"].forEach(c=>{ tr.querySelector("."+c).value=src.querySelector("."+c).value; }); }); };
  $("b_save").onclick=async()=>{ $("b_save").disabled=true;
    const out=[...d.querySelectorAll("tbody tr")].map(tr=>({ "畝ID":tr.dataset.id,"区画ID":hid(SEL),"品目":tr.querySelector(".b_item").value,"品種":tr.querySelector(".b_var").value.trim(),"株数":tr.querySelector(".b_cnt").value,"定植日":tr.querySelector(".b_date").value.trim(),"作型":tr.querySelector(".b_form").value,"状態":tr.querySelector(".b_st").value })).filter(r=>r["品目"]||r["株数"]||r["定植日"]);
    if(!out.length){ say("入力のある畝がありません","err"); $("b_save").disabled=false; return; }
    try{ const r=await post({action:"os6UpsertBeds",rows:out}); if(r.ok){ say(`畝を保存しました（${out.length}本）`); await loadAll(); const h=DATA.houses.find(x=>hid(x)===hid(SEL)); if(h) selectHouse(h);} }
    catch(e){ say("保存エラー："+e.message,"err"); } $("b_save").disabled=false; };
}

$("field").onchange=()=>{ FIELD=DATA.fields.find(f=>fid(f)===$("field").value); renderField(); };

// 起動
initMap(); loadAll();
</script>
</body>
</html>
