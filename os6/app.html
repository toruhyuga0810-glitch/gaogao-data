<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OS6 圃場管理</title>
<link rel="icon" href="data:,">
<!-- ─────────────────────────────────────────────────────────────
  OS6：Farm control 新シェル S1（2026-09-03・設計書v2＝docs/OS6_設計書v2_2026-09-03.md が正本）
  ・UIの正本＝本人モックアップ2枚。サイドバーで繋がった「1つのアプリ」
  ・S1＝シェル（サイドバー・検索・期間・通知ベル・記録者切替）＋専用ダッシュボード＋圃場管理
    （実配置の図式マップSVG＝区画の緯度経度から相対配置を再現・写真タイル不使用）
    ＋右パネル（KPI・品目表・収穫タイムライン・概算kg）
  ・収穫予測＝第1段：品目マスター（無ければ内蔵の仮係数）×株数の「概算kg」。実績学習はS2〜S4
  ・読み＝GAS読み出しAPI（順番読み＋15秒時間切れ＝規約§2）。?demo=1 でモック相当のデモデータ
  ・区画詳細（畝グリッド・生育入力）はS2。ここではプレースホルダ遷移
───────────────────────────────────────────────────────────── -->
<style>
  :root{--g:#587565;--g2:#3d5248;--g3:#dae5dd;--bg:#f4f4f1;--ink:#2b2f2d;--mut:#6b7a72;--line:#d5dcd6;--warn:#b7791f;--bad:#a94442;--blue:#1a73e8;
        --ok-bg:#e3efe6;--ok-fg:#2e5b3f;--warn-bg:#f7ecd2;--bad-bg:#f2dfda;--mut-bg:#e6e6e2;}
  *{box-sizing:border-box} html,body{margin:0;height:100%;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
  a{color:var(--blue)}
  .app{display:grid;grid-template-columns:212px 1fr;height:100vh}
  /* ── サイドバー ── */
  .side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:2px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--g2);font-size:15px;padding:4px 10px 14px}
  .brand .logo{width:26px;height:26px;border-radius:7px;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--ink);cursor:pointer;font-size:14px;border:0;background:none;text-align:left;width:100%}
  .nav svg{width:18px;height:18px;flex:none;color:var(--mut)}
  .nav.on{background:var(--g3);color:var(--g2);font-weight:600}.nav.on svg{color:var(--g2)}
  .nav:hover{background:#f2f5f2}
  .side .grow{flex:1}
  /* ── ヘッダー ── */
  .main{display:flex;flex-direction:column;min-width:0;height:100vh}
  header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);flex:none}
  header h1{font-size:17px;margin:0;color:var(--ink);font-weight:700;white-space:nowrap}
  .searchbox{position:relative;margin-left:auto}
  .searchbox input{font:inherit;width:230px;max-width:38vw;padding:8px 12px 8px 30px;border:1px solid var(--line);border-radius:9px;background:#f7f8f7}
  .searchbox .ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--mut)}
  .slist{position:absolute;top:40px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.12);max-height:40vh;overflow:auto;display:none;z-index:60}
  .slist div{padding:9px 12px;cursor:pointer;border-bottom:1px solid #f0f2f0;font-size:13px}.slist div:hover{background:var(--g3)}.slist small{color:var(--mut);display:block;font-size:11px}
  .period{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  .bell{position:relative;border:1px solid var(--line);background:#fff;border-radius:9px;width:38px;height:38px;cursor:pointer;color:var(--g2);display:flex;align-items:center;justify-content:center}
  .bell b{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 3px}
  .who{font:inherit;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 10px;cursor:pointer}
  .who .av{width:26px;height:26px;border-radius:50%;background:var(--g3);color:var(--g2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .who small{display:block;color:var(--mut);font-size:10px;text-align:left}
  /* ── 本文 ── */
  .body{flex:1;overflow:auto;padding:16px 18px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
  @media (max-width:1080px){.cols{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--ink);font-weight:700;display:flex;align-items:center;gap:8px}
  .card h2 .sub{font-weight:400;color:var(--mut);font-size:12px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi b{display:block;font-size:22px;color:var(--ink)}.kpi span{font-size:11px;color:var(--mut)}
  .kpi small{display:block;font-size:10px;color:var(--warn);margin-top:2px}
  .chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;background:var(--ok-bg);color:var(--ok-fg);white-space:nowrap}
  .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.mut{background:var(--mut-bg);color:#666}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th{color:var(--mut);font-weight:600;font-size:11px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:8px;border-bottom:1px solid #f0f2f0;vertical-align:middle}
  tr.click{cursor:pointer} tr.click:hover td{background:#f8faf8}
  .alert{display:flex;gap:8px;border-left:4px solid var(--warn);background:#fdf9ef;border-radius:0 8px 8px 0;padding:8px 10px;margin:6px 0;font-size:13px;line-height:1.55}
  .alert.bad{border-left-color:var(--bad);background:#fbf1ef} .alert.info{border-left-color:var(--g);background:#f2f6f3}
  .alert .where{color:var(--mut);font-size:11px;display:block}
  .hint{font-size:12px;color:var(--mut);line-height:1.7}
  .msg{margin:8px 0;padding:8px 10px;border-radius:8px;font-size:13px}.msg.err{background:var(--bad-bg);color:var(--bad)}
  /* ── 図式マップ ── */
  .mapcard{position:relative;padding:0;overflow:hidden}
  .maphead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{font:inherit;font-size:12px;padding:7px 12px;border:0;background:#fff;cursor:pointer;color:var(--mut)}
  .seg button.on{background:var(--g3);color:var(--g2);font-weight:600}
  .fieldsel{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;max-width:200px}
  .legend{position:absolute;right:14px;bottom:44px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:11px;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .legend b{display:block;font-size:11px;color:var(--ink);margin-bottom:4px}
  .legend div{display:flex;align-items:center;gap:6px;margin:3px 0;color:var(--mut)}
  .legend i{width:10px;height:10px;border-radius:50%}
  .canvaswrap{background:#e9eee9;min-height:430px;position:relative}
  .canvaswrap svg{display:block;width:100%;height:auto}
  .zoom{position:absolute;left:14px;bottom:44px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:9px;overflow:hidden;z-index:5}
  .zoom button{font-size:18px;width:34px;height:34px;border:0;background:#fff;cursor:pointer;color:var(--g2)}
  .mapfoot{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:11px;color:var(--mut)}
  .plot-label{font-weight:700;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px}
  .plot-sub{fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.3);stroke-width:2px}
  /* ── タイムライン ── */
  .tl{margin-top:6px}
  .tl-head,.tl-row{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center}
  .tl-weeks{display:grid;grid-template-columns:repeat(6,1fr);font-size:10px;color:var(--mut)}
  .tl-track{position:relative;height:14px;background:#f0f2f0;border-radius:7px;overflow:hidden}
  .tl-grow{position:absolute;top:0;bottom:0;background:#cfe0d4;border-radius:7px}
  .tl-harv{position:absolute;top:0;bottom:0;background:var(--g);border-radius:7px}
  .tl-name{font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tl-date{font-size:10px;color:var(--g2);font-weight:600;white-space:nowrap}
  .tl-legend{display:flex;gap:14px;font-size:11px;color:var(--mut);margin-top:8px}
  .tl-legend i{display:inline-block;width:16px;height:8px;border-radius:4px;margin-right:4px;vertical-align:middle}
  /* ── ベルのパネル・モバイル ── */
  .drop{position:fixed;top:58px;right:16px;width:min(380px,92vw);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:12px;z-index:80;display:none;max-height:70vh;overflow:auto}
  .tabbar{display:none}
  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    .side{display:none}
    .main{height:auto;min-height:100vh}
    .body{padding:12px 12px 76px}
    header{flex-wrap:wrap;row-gap:8px;padding:10px 12px}
    .searchbox{order:9;margin-left:0;flex-basis:100%}.searchbox input{width:100%;max-width:none}
    .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:70;padding-bottom:env(safe-area-inset-bottom)}
    .tabbar button{flex:1;font:inherit;font-size:10px;padding:8px 2px;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
    .tabbar button.on{color:var(--g2);font-weight:600}
    .tabbar svg{width:20px;height:20px}
  }
  .empty{padding:26px;text-align:center}
  .btn{font:inherit;display:inline-block;padding:10px 16px;border:0;border-radius:10px;background:var(--g);color:#fff;cursor:pointer;text-decoration:none;font-size:14px}
  .btn.sub{background:#fff;color:var(--g2);border:1px solid var(--line)}
  .demo{background:var(--warn-bg);color:var(--warn);font-size:12px;padding:5px 14px;text-align:center;flex:none}
</style>
</head>

<script src="os6-common.js?v=2"></script>
<script>
"use strict";
/* ══ 状態・定数 ══ */
const DEMO = new URLSearchParams(location.search).get("demo")==="1";
const DATA = {fields:[],houses:[],beds:[],records:[],tasks:[],yields:[],harvests:[]};
let VIEW="dash", SEL={fieldId:null,houseId:null}, PERIOD=14, ZOOM=1;
const USERS=["徹","父","母"], ROLES={"徹":"管理者","父":"作業者","母":"作業者"};
let USER = localStorage.getItem("gg_os6_user")||"徹";
// 株あたり概算収量g（仮・出典未検証のプレースホルダ。シート「品目マスター」があればそちらで上書き＝設計書v2 §7.5）
const YIELD_FALLBACK={"パクチー":80,"パクチーファラン":60,"空芯菜":150,"ガパオ":150,"ホーラパー":150,"カナー":200,"バイマックル":50};
const STATUS_CHIP=s=>s==="順調"?"":(s==="注意"||s==="遅延")?"warn":s==="害虫"?"bad":"mut";
const STATUS_FILL=s=>({"順調":"#7fa98c","注意":"#d9b45f","害虫":"#c47a6d","遅延":"#d9b45f","休耕":"#b9beba"})[s]||"#9fb3a5";
const fname=f=>col(f,"正規名")||fid(f);
const housesOf=fId=>DATA.houses.filter(h=>col(h,"圃場ID")===fId);
const bedsOf=hId=>DATA.beds.filter(b=>col(b,"区画ID")===hId);
const recsOf=bId=>DATA.records.filter(r=>col(r,"畝ID")===bId).slice().sort((a,b)=>col(a,"日時").localeCompare(col(b,"日時")));
const latestOf=bId=>{const r=recsOf(bId);return r.length?r[r.length-1]:null;};
const houseOfBed=b=>DATA.houses.find(h=>hid(h)===col(b,"区画ID"));
const fieldOfHouse=h=>h&&DATA.fields.find(f=>fid(f)===col(h,"圃場ID"));
const D=s=>{const d=new Date(String(s||"").replace(/-/g,"/"));return isNaN(d)?null:d;};
const daysAgo=s=>{const d=D(s);return d?Math.floor((Date.now()-d)/86400000):null;};
const daysUntil=s=>{const d=D(s);return d?Math.ceil((d-Date.now())/86400000):null;};
const fmtMD=d=>`${d.getMonth()+1}/${d.getDate()}`;
/* 概算収量：品目マスター（あれば）→ 内蔵仮係数 */
function yieldPer(item){
  const row=DATA.yields.find(y=>col(y,"品目")===item);
  if(row){const v=parseFloat(col(row,"株あたり概算収量")); if(!isNaN(v)) return {g:v, prov:col(row,"出典")||"品目マスター"};}
  if(YIELD_FALLBACK[item]!=null) return {g:YIELD_FALLBACK[item], prov:"仮"};
  return null;
}
const bedKg=b=>{const y=yieldPer(col(b,"品目")); const n=parseInt(col(b,"株数"))||0; return y? n*y.g/1000 : null;};

/* ══ アラート（v0.1の規則ベースを継承） ══ */
function computeAlerts(){
  const out=[]; const add=(level,text,b)=>{const h=b?houseOfBed(b):null,f=h?fieldOfHouse(h):null;
    out.push({level,text,where:[f?fname(f):"",h?col(h,"名称")||hid(h):""].filter(Boolean).join(" › "),fieldId:f?fid(f):null,houseId:h?hid(h):null});};
  DATA.beds.forEach(b=>{
    const item=col(b,"品目")||bid(b), last=latestOf(bid(b));
    if(last){
      const pest=col(last,"病害虫（")||col(last,"病害虫");
      if(pest==="多い"||pest==="中程度") add(pest==="多い"?"bad":"warn",`${item}：病害虫「${pest}」（${col(last,"病害虫の種類")||"種類未記入"}）。防除を検討`,b);
      const soil=col(last,"土壌水分");
      if(soil==="乾燥"||soil==="やや乾燥") add("warn",`${item}：土壌が「${soil}」。灌水を検討`,b);
      if(soil==="湿りすぎ") add("warn",`${item}：土壌が「湿りすぎ」。排水を確認`,b);
      const leaf=col(last,"葉色"); if(leaf==="薄い"||leaf==="やや薄い") add("info",`${item}：葉色「${leaf}」。追肥・日照を確認`,b);
      const ago=daysAgo(col(last,"日時")); if(ago!=null&&ago>=7) add("info",`${item}：最終記録から${ago}日。巡回で記録を`,b);
    } else if(col(b,"定植日")) add("info",`${item}：巡回記録がまだありません`,b);
    const harv=col(b,"収穫開始見込み"); if(harv){const d=daysUntil(harv); if(d!=null&&d>=0&&d<=7) add("info",`${item}：収穫開始まで${d===0?"今日":d+"日"}（${harv}）`,b);}
  });
  DATA.tasks.forEach(t=>{ if(col(t,"状態")==="遅延"){const b=DATA.beds.find(x=>bid(x)===col(t,"畝ID"));
    add("warn",`作業「${col(t,"作業種")||"?"}」が遅延（予定 ${col(t,"日付")}）${col(t,"内容")?"："+col(t,"内容"):""}`,b);} });
  const rank={bad:0,warn:1,info:2}; out.sort((a,b)=>rank[a.level]-rank[b.level]); return out;
}

const withTimeout=(p,ms,l)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(`${l} 時間切れ`)),ms))]);
async function loadAll(){
  if(DEMO){ Object.assign(DATA,demoData()); $("demoBar").style.display=""; render(); return; }

  for(const [k,tab] of wants){

  }
  DATA.__failed=failed; render();
}

/* ══ 図式マップ（実配置＝緯度経度→ローカル座標） ══ */
function fieldSVG(fId,width){
  const hs=housesOf(fId).map(h=>{ let pts=null; try{pts=JSON.parse(col(h,"図形")||"null");}catch(e){}
    return {h,pts:(Array.isArray(pts)&&pts.length>=3)?pts:null}; });
  const drawn=hs.filter(x=>x.pts);
  if(!drawn.length) return {html:`<div class="empty"><p class="hint">この圃場にはまだ図形つきの区画がありません。「かんたん登録」で追加できます。</p><a class="btn" href="wizard.html">＋ 区画を登録</a></div>`};
  const lat0=drawn.flatMap(x=>x.pts).reduce((s,p)=>s+p[0],0)/drawn.flatMap(x=>x.pts).length;
  const toXY=p=>[ (p[1])*111320*Math.cos(lat0*Math.PI/180), -(p[0])*111320 ];
  let minX=1e15,maxX=-1e15,minY=1e15,maxY=-1e15;
  const shapes=drawn.map(x=>{ const xy=x.pts.map(toXY);
    xy.forEach(([px,py])=>{minX=Math.min(minX,px);maxX=Math.max(maxX,px);minY=Math.min(minY,py);maxY=Math.max(maxY,py);});
    return {h:x.h,xy}; });
  const pad=18, W=maxX-minX||1, Hh=maxY-minY||1;
  const vw=width||760, scale=(vw-pad*2)/W, vh=Math.max(320,Math.min(640,Hh*scale+pad*2));
  const sc=Math.min(scale,(vh-pad*2)/Hh);
  const ox=(vw-W*sc)/2-minX*sc, oy=(vh-Hh*sc)/2-minY*sc;
  const body=shapes.map(({h,xy})=>{
    const id=hid(h), st=col(h,"状態"), sel=SEL.houseId===id;
    // 実配置＝位置は緯度経度どおり・大きさは読める最小サイズまで拡大（実寸だと区画が点になる）
    let scr=xy.map(([px,py])=>[px*sc+ox,py*sc+oy]);
    const cx=scr.reduce((s,p)=>s+p[0],0)/scr.length, cy=scr.reduce((s,p)=>s+p[1],0)/scr.length;
    const bw=Math.max(...scr.map(p=>p[0]))-Math.min(...scr.map(p=>p[0])), bh=Math.max(...scr.map(p=>p[1]))-Math.min(...scr.map(p=>p[1]));
    const mag=Math.min(6,Math.max(1,110/(bw||1),74/(bh||1)));
    if(mag>1) scr=scr.map(([px,py])=>[cx+(px-cx)*mag, cy+(py-cy)*mag]);
    const P=p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`;
    const kind=col(h,"種別"), fill=kind==="ハウス"?"#f3f5f2":"#8fae97";
    const area=col(h,"面積")?`${col(h,"面積")}m²`:"";
    const chipC={"":"#7fa98c","順調":"#7fa98c","注意":"#d9a13f","害虫":"#c05f4e","遅延":"#d9a13f","休耕":"#9aa09b","未入力":"#9aa09b"}[st]||"#9aa09b";
    return `<g class="plot" data-house="${esc(id)}" style="cursor:pointer">
      <polygon points="${scr.map(P).join(" ")}" fill="${fill}" stroke="${sel?"#2e7d4f":STATUS_FILL(st)}" stroke-width="${sel?4:2}" ${sel?'filter="url(#glow)"':""} rx="6"/>
      <text x="${cx}" y="${cy-8}" text-anchor="middle" font-size="13" class="plot-label" fill="${kind==="ハウス"?"#3d5248":"#fff"}" stroke="${kind==="ハウス"?"rgba(255,255,255,.8)":"rgba(0,0,0,.35)"}">${esc(col(h,"名称")||id)}</text>
      <text x="${cx}" y="${cy+7}" text-anchor="middle" font-size="10" class="plot-sub" fill="${kind==="ハウス"?"#6b7a72":"#eef"}" stroke="${kind==="ハウス"?"rgba(255,255,255,.8)":"rgba(0,0,0,.3)"}">${esc(area)}</text>
      <g transform="translate(${cx},${cy+22})"><rect x="-26" y="-9" width="52" height="16" rx="8" fill="${chipC}"/><text text-anchor="middle" y="3" font-size="9" fill="#fff">${esc(st||"未入力")}</text></g>
    </g>`;
  }).join("");
  const html=`<svg viewBox="0 0 ${vw} ${vh}" style="transform:scale(${ZOOM});transform-origin:center">
    <defs><filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#2e7d4f" flood-opacity=".8"/></filter></defs>${body}</svg>`;
  return {html};
}

/* ══ 収穫タイムライン（期間セレクタ連動） ══ */
function timelineHTML(beds){
  const t0=new Date(); t0.setHours(0,0,0,0); t0.setDate(t0.getDate()-t0.getDay()+1); // 今週の月曜
  const span=Math.max(PERIOD,28)/7*7*86400000*1.5, t1=new Date(t0.getTime()+span);
  const weeks=[]; for(let d=new Date(t0); d<t1; d.setDate(d.getDate()+7)) weeks.push(fmtMD(new Date(d)));
  const rows=beds.filter(b=>col(b,"品目")).map(b=>{
    const pl=D(col(b,"定植日")), hs=D(col(b,"収穫開始見込み")), he=D(col(b,"収穫終了見込み"))|| (hs&&new Date(hs.getTime()+14*86400000));
    if(!pl&&!hs) return "";
    const X=d=>Math.max(0,Math.min(100,(d-t0)/(t1-t0)*100));
    const growL=pl?X(pl):0, growR=hs?X(hs):100, harvR=he?X(he):Math.min(100,growR+10);
    const dLabel=hs?fmtMD(hs):"";
    return `<div class="tl-row" style="margin:7px 0"><span class="tl-name">${esc(col(b,"品目"))}</span>
      <div style="display:flex;align-items:center;gap:6px"><div class="tl-track" style="flex:1">
        <div class="tl-grow" style="left:${growL}%;width:${Math.max(0,growR-growL)}%"></div>
        <div class="tl-harv" style="left:${growR}%;width:${Math.max(2,harvR-growR)}%"></div>
      </div><span class="tl-date">${esc(dLabel)}</span></div></div>`;
  }).filter(Boolean).join("");
  if(!rows) return `<p class="hint">定植日・収穫見込みが入ると、ここにタイムラインが出ます。</p>`;
  return `<div class="tl"><div class="tl-head"><span></span><div class="tl-weeks">${weeks.slice(0,6).map(w=>`<span>${w}</span>`).join("")}</div></div>${rows}
    <div class="tl-legend"><span><i style="background:#cfe0d4"></i>生育中</span><span><i style="background:var(--g)"></i>収穫予定期間</span></div></div>`;
}

/* ══ 右パネル（選択区画） ══ */
function panelHTML(h){

  const kgs=beds.map(bedKg).filter(v=>v!=null);

      <td>${kgv!=null?Math.round(kgv)+"kg":"—"}</td><td>${du!=null?(du<=0?"収穫期":du+"日"):"—"}</td>
      <td><span class="chip ${STATUS_CHIP(col(b,"状態"))}">${esc(col(b,"状態")||"未入力")}</span></td></tr>`;

    <div class="kpis" style="grid-template-columns:repeat(3,1fr)">

      <div class="kpi"><b>${kg!=null?kg:"—"}<span style="font-size:12px"> kg</span></b><span>予想収穫合計</span><small>概算（実績で学習・S4）</small></div>
      <div class="kpi"><b style="font-size:15px">${next?fmtMD(next):"—"}</b><span>次回収穫予定${next?`（あと${Math.max(0,daysUntil(next))}日）`:""}</span></div>
    </div>
    ${rows?`<table><tr><th>品目</th><th>株数</th><th>予想収穫</th><th>収穫まで</th><th>状態</th></tr>${rows}</table>`:`<p class="hint">畝・品目が未登録です。かんたん登録で追加できます。</p>`}
    <h2 style="margin-top:16px">収穫タイムライン <span class="sub">（${esc(col(h,"名称")||"")}）</span></h2>
    ${timelineHTML(beds)}
    <p style="margin:14px 0 2px"><button class="btn" data-plot="${esc(hid(h))}">詳細情報を表示 →</button></p>
    <p class="hint">畝ごとの詳細・生育入力・提案は「区画詳細」画面（S2）で入ります。</p>
  </div>`;
}

  wirePlotButtons();
}
function wirePlotButtons(){ document.querySelectorAll("[data-plot]").forEach(b=>b.addEventListener("click",()=>{ alert("区画詳細（畝グリッド・生育入力・提案）はS2で入ります。いまは旧画面で記録できます：record.html"); })); }

/* ══ 画面：ダッシュボード ══ */
function renderDash(){
  if(!DATA.fields.length){ $("body").innerHTML=emptyHTML(); return; }
  const A=computeAlerts(); $("bellN").style.display=A.length?"flex":"none"; $("bellN").textContent=A.length;
  const stocks=DATA.beds.reduce((s,b)=>s+(parseInt(col(b,"株数"))||0),0);
  const kgs=DATA.beds.map(bedKg).filter(v=>v!=null);
  const soon=DATA.beds.filter(b=>{const d=daysUntil(col(b,"収穫開始見込み"));return d!=null&&d>=-3&&d<=PERIOD;})
    .sort((a,b)=>D(col(a,"収穫開始見込み"))-D(col(b,"収穫開始見込み")));
  const lastRecs=DATA.records.slice().sort((a,b)=>col(b,"日時").localeCompare(col(a,"日時"))).slice(0,5);
  $("body").innerHTML=`
    ${DATA.__failed&&DATA.__failed.length?`<div class="msg err">読めなかったタブ：${esc(DATA.__failed.join("・"))}</div>`:""}
    <div class="kpis">
      <div class="kpi"><b>${DATA.fields.length}</b><span>圃場</span></div>
      <div class="kpi"><b>${DATA.houses.length}</b><span>区画</span></div>
      <div class="kpi"><b>${DATA.beds.length}</b><span>作付け畝</span></div>
      <div class="kpi"><b>${stocks.toLocaleString()}</b><span>総株数</span></div>
      <div class="kpi"><b>${kgs.length?Math.round(kgs.reduce((a,b)=>a+b,0)):"—"}<span style="font-size:12px"> kg</span></b><span>予想収穫合計</span><small>概算（実績で学習・S4）</small></div>
    </div>
    <div class="cols">
      <div>
        <div class="card"><h2>注意がいるところ <span class="sub">${A.length}件</span></h2>
          ${A.length?A.slice(0,6).map(alertHTML).join(""):`<p class="hint">いまの記録から目立つ注意点はありません。</p>`}
          ${A.length>6?`<p class="hint">ほか${A.length-6}件はベル（右上）から</p>`:""}</div>
        <div class="card" style="margin-top:14px"><h2>圃場</h2>
          ${DATA.fields.map(f=>{ const hs=housesOf(fid(f)); const worst=["害虫","遅延","注意"].find(s=>hs.some(h=>col(h,"状態")===s));
            return `<table style="margin:2px 0"><tr class="click" data-field="${esc(fid(f))}">
              <td style="border:0"><b>${esc(fname(f))}</b><br><span class="hint">${esc(col(f,"所在地")||"")}／区画${hs.length}・畝${hs.flatMap(h=>bedsOf(hid(h))).length}</span></td>
              <td style="border:0;text-align:right"><span class="chip ${worst?STATUS_CHIP(worst):""}">${worst?worst+"あり":"順調"}</span></td></tr></table>`; }).join("")}</div>
      </div>
      <div>
        <div class="card"><h2>収穫予定 <span class="sub">${PERIOD}日以内</span></h2>
          ${soon.length?`<table><tr><th>品目</th><th>どこ</th><th>開始</th><th>概算</th></tr>${soon.slice(0,8).map(b=>{const h=houseOfBed(b);const kgv=bedKg(b);
            return `<tr class="click" data-house="${esc(col(b,"区画ID"))}"><td>${esc(col(b,"品目"))}</td><td class="hint">${esc(h?col(h,"名称"):"")}</td><td>${esc(col(b,"収穫開始見込み").slice(5))}</td><td>${kgv!=null?Math.round(kgv)+"kg":"—"}</td></tr>`;}).join("")}</table>`
            :`<p class="hint">${PERIOD}日以内の収穫予定はありません（期間は右上で変えられます）。</p>`}</div>
        <div class="card" style="margin-top:14px"><h2>最近の記録</h2>
          ${lastRecs.length?lastRecs.map(r=>{const b=DATA.beds.find(x=>bid(x)===col(r,"畝ID"));const h=b&&houseOfBed(b);
            return `<div style="padding:6px 0;border-bottom:1px solid #f0f2f0;font-size:13px">${esc(col(r,"日時").slice(5,16))}　<b>${esc(b?col(b,"品目"):col(r,"畝ID"))}</b> 草丈${esc(col(r,"草丈")||"-")}cm <span class="hint">${esc(h?col(h,"名称"):"")}・${esc(col(r,"記録者")||"")}</span></div>`;}).join("")
            :`<p class="hint">記録が入るとここに出ます。</p>`}
          <p style="margin:12px 0 2px"><a class="btn sub" href="record.html">巡回記録をつける（旧画面・S2で統合）</a></p></div>
      </div>
    </div>`;
  wireAlerts($("body"));
  document.querySelectorAll("[data-field]").forEach(el=>el.addEventListener("click",()=>go("farm",{fieldId:el.dataset.field,houseId:null})));
  document.querySelectorAll("tr[data-house]").forEach(el=>el.addEventListener("click",()=>{const h=DATA.houses.find(x=>hid(x)===el.dataset.house);go("farm",{fieldId:h?col(h,"圃場ID"):null,houseId:el.dataset.house});}));
}

/* ══ 席だけの画面・設定・空状態 ══ */
const seatHTML=(t,items)=>`<div class="card"><h2>${t}</h2><p class="hint">この画面は<b>段E（数字の接続）で開通</b>します。予定している中身：</p><ul class="hint">${items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`;
function renderPlan(){ $("body").innerHTML=seatHTML("作付計画",["畝×品目×作型の計画表（畝・作付けタブが正本）","EcoCrop×平年値の作付け窓との突合（climate_fit）","来季修正の比較ビュー（計画 vs 実績）"]); }
function renderForecast(){ $("body").innerHTML=seatHTML("収穫予測",["概算kg（品目マスター×株数）→ 実績kg/株で係数を自動補正（S4）","収穫実績の記録と品目別の的中率","気候変数（アメダス実況・積算温度）の追加（段E）"]); }
function renderSettings(){
  $("body").innerHTML=`<div class="card"><h2>設定・道具</h2>
    <p><a class="btn" href="wizard.html">＋ かんたん登録（圃場・区画の追加）</a></p>
    <p class="hint" style="margin-top:10px">・位置の確認・境界の精密化：<a href="setup.html">地図で編集（上級）</a>（ふだんは不要。Claudeに「◯◯の境界を直して」と頼めば代行します）<br>
    ・巡回記録（旧画面・S2でこのアプリに統合）：<a href="record.html">record.html</a><br>
    ・記録する人の切り替え＝右上の顔ボタン（いま：<b>${esc(USER)}</b>）。記録の「記録者」に自動で入ります<br>
    ・スマホでは<b>ホーム画面に追加</b>して使ってください（iPhoneは7日使わないとブラウザ保存が消える仕様のため）</p></div>`;
}
const emptyHTML=()=>`<div class="card empty"><h2 style="justify-content:center">まだ圃場がありません</h2>
  <p class="hint">「かんたん登録」でピンを1回打って質問に答えるだけ（約1分）で、圃場・区画・畝のマス目まで登録できます。<br>デモの完成形は <a href="?demo=1">?demo=1</a> で確認できます。</p>
  <a class="btn" href="wizard.html">かんたん登録をはじめる</a></div>`;

/* ══ ルーター ══ */
function render(){
  const A=computeAlerts(); $("bellN").style.display=A.length?"flex":"none"; $("bellN").textContent=A.length;
  ({dash:renderDash,farm:renderFarm,plan:renderPlan,forecast:renderForecast,settings:renderSettings}[VIEW]||renderDash)();
}
go("dash");
loadAll().catch(e=>{ $("body").innerHTML=`<div class="msg err">読み込みに失敗しました：${esc(e.message||e)}</div>`; });
</script>
</body>
</html>
